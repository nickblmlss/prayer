<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/blameless-ministries-design-system-0fb65eda-218a-45e4-9df5-6170da0512bf/tokens/fonts.css">
  <link rel="stylesheet" href="_ds/blameless-ministries-design-system-0fb65eda-218a-45e4-9df5-6170da0512bf/tokens/colors.css">
  <link rel="stylesheet" href="_ds/blameless-ministries-design-system-0fb65eda-218a-45e4-9df5-6170da0512bf/tokens/typography.css">
  <link rel="stylesheet" href="_ds/blameless-ministries-design-system-0fb65eda-218a-45e4-9df5-6170da0512bf/tokens/base.css">
  <link rel="stylesheet" href="_ds/blameless-ministries-design-system-0fb65eda-218a-45e4-9df5-6170da0512bf/styles.css">
  <script src="_ds/blameless-ministries-design-system-0fb65eda-218a-45e4-9df5-6170da0512bf/_ds_bundle.js"></script>
  <style>
    @font-face{font-family:'Restora';src:url('assets/fonts/Restora.otf') format('opentype');font-weight:400;font-style:normal;font-display:swap;}
    :root{--font-display:'Restora','Prata',Georgia,serif;}
  </style>
</helmet>

<section style="font-family: var(--font-body),'Source Sans 3',system-ui,sans-serif; color: #1E1B16; width: 100%; max-width: 64ch">
  <div style="font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:rgba(30,27,22,.45);margin-bottom:12px">{{ eyebrow }}</div>
  
  <h3 style="font-family:var(--font-display),'Prata',Georgia,serif;font-weight:400;font-size:26px;line-height:1.22;margin:0 0 14px">{{ heading }}</h3><p style="font-size:17px;line-height:1.65;margin:0 0 20px;color:rgba(30,27,22,.7)">{{ description }}</p>

  <sc-if value="{{ isClosed }}" hint-placeholder-val="{{ true }}">
    <button type="button" onClick="{{ open }}" style="appearance:none;cursor:pointer;font:inherit;font-size:11px;letter-spacing:.18em;text-transform:uppercase;padding:10px 18px;border:1px solid rgba(30,27,22,.15);border-radius:4px;background:transparent;color:#1E1B16;white-space:nowrap" style-hover="background:#EEE6DB">{{ buttonLabel }}</button>
  </sc-if>

  <sc-if value="{{ isOpen }}">
    <div style="background:#F9D7DB;padding:28px;border-radius:6px;max-width:52ch">
      <p style="font-size:16px;line-height:1.6;margin:0 0 6px"><strong>{{ confirmHeading }}</strong></p>
      <p style="font-size:16px;line-height:1.6;margin:0 0 18px">This cannot be undone. To confirm, type <strong>reset</strong> in the field below.</p>
      <input type="text" value="{{ typedValue }}" onChange="{{ onTyped }}" placeholder="reset" aria-label="Type reset to confirm" style="width:100%;box-sizing:border-box;padding:12px 14px;font-size:17px;font-family:inherit;background:#FFFFFF;border:1px solid rgba(30,27,22,.15);border-radius:4px;color:#1E1B16;margin-bottom:18px">
      <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center">
        <button type="button" onClick="{{ confirm }}" disabled="{{ disabled }}" style="{{ confirmStyle }}">{{ confirmLabel }}</button>
        <button type="button" onClick="{{ cancel }}" style="appearance:none;cursor:pointer;font:inherit;font-size:11px;letter-spacing:.18em;text-transform:uppercase;padding:10px 18px;border:0;background:none;color:rgba(30,27,22,.55)">Cancel</button>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{ justReset }}">
    <div style="margin-top:18px;font-size:15px;line-height:1.6;color:rgba(30,27,22,.7)">Everything has been cleared. You can start again from the beginning.</div>
  </sc-if>
</section>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:720,&quot;height&quot;:320},&quot;eyebrow&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Starting over&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;heading&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Reset your answers&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;description&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Resetting clears every step you have marked complete, your reading progress and everything you have written on this device.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;buttonLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Reset your answers&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;confirmHeading&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Are you sure?&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;confirmLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Reset everything&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;onConfirm&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  state = { open: false, typed: '', reset: false };

  ok(){ return (this.state.typed || '').trim().toLowerCase() === 'reset'; }

  renderVals(){
    const ok = this.ok();
    return {
      eyebrow: this.props.eyebrow ?? 'Starting over',
      heading: this.props.heading ?? 'Reset your answers',
      description: this.props.description ?? 'Resetting clears every step you have marked complete, your reading progress and everything you have written on this device.',
      buttonLabel: this.props.buttonLabel ?? 'Reset your answers',
      confirmHeading: this.props.confirmHeading ?? 'Are you sure?',
      confirmLabel: this.props.confirmLabel ?? 'Reset everything',
      isClosed: !this.state.open,
      isOpen: this.state.open,
      justReset: this.state.reset && !this.state.open,
      typedValue: this.state.typed,
      disabled: !ok,
      confirmStyle: 'appearance:none;font:inherit;font-size:11px;letter-spacing:.18em;text-transform:uppercase;padding:10px 18px;border-radius:4px;border:1px solid #1E1B16;' +
        (ok ? 'background:#1E1B16;color:#F7F3ED;cursor:pointer;'
            : 'background:rgba(30,27,22,.08);color:rgba(30,27,22,.35);border-color:rgba(30,27,22,.15);cursor:not-allowed;'),
      open: () => this.setState({ open: true, typed: '', reset: false }),
      cancel: () => this.setState({ open: false, typed: '' }),
      onTyped: (e) => this.setState({ typed: e.target.value }),
      confirm: () => {
        if (!this.ok()) return;
        if (typeof this.props.onConfirm === 'function') this.props.onConfirm();
        this.setState({ open: false, typed: '', reset: true });
      }
    };
  }
}
</script>
</body>
</html>
