document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);

    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

        (e.origin === 'null' &&

            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')

    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;

          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"f14166b5-6560-4204-8d09-bbffb100a76a\"><\u002Fscript>\n\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n  <style>@font-face{font-family:\"Prata\";font-style:normal;font-weight:400;font-display:swap;src:url(\"b4ea960e-645b-4e7f-bfed-4939bc05a8eb\") format(\"woff2\")}\n@font-face{font-family:\"Source Sans 3\";font-style:normal;font-weight:300 700;font-display:swap;src:url(\"2fb7d314-14a8-482f-8fc4-76bc3566a4e1\") format(\"woff2\")}\n@font-face{font-family:\"Source Sans 3\";font-style:italic;font-weight:300 700;font-display:swap;src:url(\"6291ccfc-73db-4d79-bdde-db4906790991\") format(\"woff2\")}\n<\u002Fstyle>\n  <style>:root{\n/* --- Base --- */\n--cream:#F7F3ED;/* site background, matches blmlss.com */\n--white:#FFFFFF;\n--ink:#1E1B16;/* primary text */\n--ink-70:rgba(30,27,22,.70);\n--ink-45:rgba(30,27,22,.45);\n--ink-15:rgba(30,27,22,.15);\n--ink-08:rgba(30,27,22,.08);\n\n/* --- Cool tones --- */\n--dusty-blue-gray:#ADC1C6;\n--deep-teal-gray:#8EAAAF;\n--powder-blue:#D9E0ED;\n--slate-blue:#AEBFD7;\n--mint:#D0EAE6;\n--sage-teal:#A5CEC7;\n\n/* --- Warm tones --- */\n--peach:#FFD2B8;\n--apricot:#FFB88F;\n--sand:#EEE6DB;\n--tan:#DAC9B5;\n--sage-green:#DCDFCE;\n--olive:#C6CCA1;\n\n/* --- Purples & pinks --- */\n--lavender:#E2DBEF;\n--light-violet:#C8B8E4;\n--blush:#F9D7DB;\n--dusty-rose:#EEADB7;\n\n/* --- Semantic surfaces --- */\n--surface-page:var(--cream);\n--surface-card:var(--white);\n--surface-muted:var(--sand);\n--surface-soft:var(--powder-blue);\n--surface-inverse:var(--deep-teal-gray);\n--surface-scripture:var(--lavender);\n\n/* --- Semantic text --- */\n--text-body:var(--ink);\n--text-muted:var(--ink-70);\n--text-eyebrow:var(--ink-45);\n--text-on-inverse:var(--cream);\n\n/* --- Lines --- */\n--border-hairline:var(--ink-15);\n--border-soft:var(--tan);\n--divider:var(--dusty-blue-gray);\n\n/* --- Interactive --- */\n--action- 2px, 9vw, 96px); line-height: 1.08; letter-spacing: 0.01em; text-transform: uppercase; margin: 0;\">Living Free<\u002Fh1>\n        <\u002Fdiv>\n        <div style=\"max-width: 62ch; display: grid; gap: 20px;\">\n          <p style=\"font-family: var(--font-display); font-size: clamp(22px, 2.4vw, 28px); line-height: 1.35; margin: 0;\">A 30 day workbook for maintaining your deliverance.<\u002Fp>\n          <p style=\"margin: 0; color: var(--ink-70);\">This copy has been prepared as a personal, free resource for those who have gone through prayer with Blameless Ministries. Work through it one day at a time. Everything you write is saved in this browser, so you can close it and come back.<\u002Fp>\n          <div style=\"display: flex; flex-wrap: wrap; gap: 12px; margin-top: 8px;\">\n            <button sc-camel-on-click=\"{{ resume }}\" style=\"appearance: none; cursor: pointer; font-family: var(--font-body); font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; padding: 15px 28px; border: 1px solid var(--ink); border-radius: 4px; background: var(--ink); color: var(--cream);\" style-hover=\"background: var(--action-primary-hover);\">{{ ctaLabel }}<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ goPlan }}\" style=\"appearance: none; cursor: pointer; font-family: var(--font-body); font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; padding: 15px 28px; border: 1px solid var(--ink-15); border-radius: 4px; background: transparent; color: var(--ink);\" style-hover=\"background: var(--sand);\">Your Battle Plan<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n      <section style=\"background: var(--surface-scripture);\">\n        <div style=\"max-width: 1240px; margin: 0 auto; padding: clamp(48px, 7vw, 96px) 24px;\">\n          <blockquote style=\"margin: 0; font-family: var(--font-display); font-weight: 400; font-size: clamp(26px, 3.4vw, 44px); line-height: 1.28; max-width: 26ch;\">“Now may the God of peace himself sanctify you completely, and may your whole spirit and soul and body be kept blameless at the coming of our Lord Jesus Christ.”<\u002Fblockquote>\n          <div style=\"margin-top: 28px; font-family: var(--font-body); font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink);\">1 Thessalonians 5:23<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n      <section style=\"max-width: 1240px; margin: 0 auto; padding: clamp(56px, 8vw, 104px) 24px;\">\n        <div style=\"font-family: var(--font-body); font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-45); margin-bottom: 28px;\">How the 30 days are built<\u002Fdiv>\n        <div style=\"display: grid; gap: 2px; max-width: 900px;\">\n          <sc-for list=\"{{ sectionSummary }}\" as=\"s\" hint-placeholder-count=\"7\">\n            <div style=\"border-top: 1px solid var(--ink-15); padding: 20px 0; display: flex; gap: 24px; align-items: baseline;\">\n              <span style=\"font-family: var(--font-display); font-size: 15px; letter-spacing: 0.1em; color: var(--ink-45); min-width: 36px;\">{{ s.numeral }}<\u002Fspan>\n              <span style=\"flex: 1; display: grid; gap: 6px;\">\n                <span style=\"font-family: var(--font-display); font-size: clamp(20px, 2.2vw, 26px); line-height: 1.25; letter-spacing: 0.03em; text-transform: uppercase;\">{{ s.title }}<\u002Fspan>\n                <span style=\"color: var(--ink-70); font-size: 16px;\">{{ s.subtitle }}<\u002Fspan>\n              <\u002Fspan>\n              <span style=\"font-family: var(--font-body); font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-45); white-space: nowrap;\">{{ s.days }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fmain>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isUnit }}\" hint-placeholder-val=\"{{ false }}\">\n    <main style=\"max-width: 760px; margin: 0 auto; padding: clamp(40px, 6vw, 80px) 24px 40px;\">\n      <div style=\"display: flex; gap: 16px; align-items: baseline; margin-bottom: 18px;\">\n        <span style=\"font-family: var(--font-body); font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-45);\">{{ unitEyebrow }}<\u002Fspan>\n        <span style=\"font-family: var(--font-display); font-size: 13px; letter-spacing: 0.14em; color: var(--ink-45);\">{{ unitNumeral }}<\u002Fspan>\n      <\u002Fdiv>\n      <h1 style=\"font-family: var(--font-display); font-weight: 400; font-size: clamp(34px, 5vw, 56px); line-height: 1.14; letter-spacing: 0.02em; text-transform: uppercase; margin: 0 0 14px;\">{{ unitTitle }}<\u002Fh1>\n      <p style=\"font-family: var(--font-display); font-size: clamp(19px, 2.2vw, 24px); line-height: 1.35; color: var(--ink-70); margin: 0 0 44px;\">{{ unitSubtitle }}<\u002Fp>\n\n      <sc-for list=\"{{ blocks }}\" as=\"b\" hint-placeholder-count=\"8\">\n        <div style=\"margin-bottom: {{ b.gap }};\">\n          <sc-if value=\"{{ b.isP }}\" hint-placeholder-val=\"{{ true }}\">\n            <p style=\"margin: 0; text-wrap: pretty;\" sc-camel-dangerously-set-inner-h-t-m-l=\"{{ b.html }}\"><\u002Fp>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ b.isH }}\" hint-placeholder-val=\"{{ false }}\">\n            <h2 style=\"font-family: var(--font-display); font-weight: 400; font-size: clamp(23px, 2.6vw, 30px); line-height: 1.25; letter-spacing: 0.03em; text-transform: uppercase; margin: 0;\">{{ b.x }}<\u002Fh2>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ b.isUL }}\" hint-placeholder-val=\"{{ false }}\">\n            <ul style=\"margin: 0; padding-left: 22px; display: grid; gap: 8px;\">\n              <sc-for list=\"{{ b.items }}\" as=\"it\" hint-placeholder-count=\"3\">\n                <li style=\"text-wrap: pretty;\" sc-camel-dangerously-set-inner-h-t-m-l=\"{{ it.html }}\"><\u002Fli>\n              <\u002Fsc-for>\n            <\u002Ful>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ b.isOL }}\" hint-placeholder-val=\"{{ false }}\">\n            <ol style=\"margin: 0; padding-left: 22px; display: grid; gap: 8px;\">\n              <sc-for list=\"{{ b.items }}\" as=\"it\" hint-placeholder-count=\"3\">\n                <li style=\"text-wrap: pretty;\" sc-camel-dangerously-set-inner-h-t-m-l=\"{{ it.html }}\"><\u002Fli>\n              <\u002Fsc-for>\n            <\u002Fol>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ b.isS }}\" hint-placeholder-val=\"{{ false }}\">\n            <figure style=\"margin: 0; background: var(--surface-scripture); padding: 28px 28px 24px;\">\n              <blockquote style=\"margin: 0; font-family: var(--font-display); font-weight: 400; font-size: clamp(19px, 2.1vw, 23px); line-height: 1.38;\">“{{ b.x }}”<\u002Fblockquote>\n              <figcaption style=\"margin-top: 16px; font-family: var(--font-body); font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink);\">{{ b.ref }}<\u002Ffigcaption>\n            <\u002Ffigure>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ b.isEX }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"border-left: 0; border-top: 1px solid var(--ink-15); border-bottom: 1px solid var(--ink-15); padding: 18px 0; font-size: 16px; color: var(--ink-70);\" sc-camel-dangerously-set-inner-h-t-m-l=\"{{ b.html }}\"><\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ b.isW }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display: grid; gap: 8px;\">\n              <label style=\"font-size: 15px; font-weight: 600;\" sc-camel-html-for=\"{{ b.id }}\">{{ b.label }}<\u002Flabel>\n              <sc-if value=\"{{ b.hint }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"font-size: 13px; color: var(--ink-45); margin-top: -4px;\">{{ b.hint }}<\u002Fdiv>\n              <\u002Fsc-if>\n              <textarea id=\"{{ b.id }}\" value=\"{{ b.value }}\" sc-camel-on-change=\"{{ b.onChange }}\" rows=\"3\" placeholder=\"Write here…\" style=\"width: 100%; min-height: 92px; resize: vertical; background: var(--white); border: 1px solid var(--ink-15); border-radius: 4px; padding: 14px; font-size: 16px; line-height: 1.55; color: var(--ink);\"><\u002Ftextarea>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ b.isPanel }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"background: {{ b.bg }}; border: {{ b.border }}; padding: clamp(24px, 4vw, 36px);\">\n              <div style=\"font-family: var(--font-body); font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-45); margin-bottom: 20px;\">{{ b.title }}<\u002Fdiv>\n              <sc-for list=\"{{ b.blocks }}\" as=\"ib\" hint-placeholder-count=\"3\">\n                <div style=\"margin-bottom: {{ ib.gap }};\">\n                  <sc-if value=\"{{ ib.isP }}\" hint-placeholder-val=\"{{ true }}\">\n                    <p style=\"margin: 0; text-wrap: pretty;\" sc-camel-dangerously-set-inner-h-t-m-l=\"{{ ib.html }}\"><\u002Fp>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ ib.isH }}\" hint-placeholder-val=\"{{ false }}\">\n                    <h3 style=\"font-family: var(--font-display); font-weight: 400; font-size: 22px; line-height: 1.25; margin: 0;\">{{ ib.x }}<\u002Fh3>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ ib.isUL }}\" hint-placeholder-val=\"{{ false }}\">\n                    <ul style=\"margin: 0; padding-left: 22px; display: grid; gap: 8px;\">\n                      <sc-for list=\"{{ ib.items }}\" as=\"it\" hint-placeholder-count=\"3\">\n                        <li style=\"text-wrap: pretty;\" sc-camel-dangerously-set-inner-h-t-m-l=\"{{ it.html }}\"><\u002Fli>\n                      <\u002Fsc-for>\n                    <\u002Ful>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ ib.isOL }}\" hint-placeholder-val=\"{{ false }}\">\n                    <ol style=\"margin: 0; padding-left: 22px; display: grid; gap: 8px;\">\n                      <sc-for list=\"{{ ib.items }}\" as=\"it\" hint-placeholder-count=\"3\">\n                        <li style=\"text-wrap: pretty;\" sc-camel-dangerously-set-inner-h-t-m-l=\"{{ it.html }}\"><\u002Fli>\n                      <\u002Fsc-for>\n                    <\u002Fol>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ ib.isS }}\" hint-placeholder-val=\"{{ false }}\">\n                    <figure style=\"margin: 0; padding: 4px 0 0;\">\n                      <blockquote style=\"margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 21px; line-height: 1.38;\">“{{ ib.x }}”<\u002Fblockquote>\n                      <figcaption style=\"margin-top: 12px; font-family: var(--font-body); font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink);\">{{ ib.ref }}<\u002Ffigcaption>\n                    <\u002Ffigure>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ ib.isEX }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"background: var(--cream); padding: 16px 18px; font-size: 16px; color: var(--ink-70);\" sc-camel-dangerously-set-inner-h-t-m-l=\"{{ ib.html }}\"><\u002Fdiv>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ ib.isW }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"display: grid; gap: 8px;\">\n                      <label style=\"font-size: 15px; font-weight: 600;\" sc-camel-html-for=\"{{ ib.id }}\">{{ ib.label }}<\u002Flabel>\n                      <sc-if value=\"{{ ib.hint }}\" hint-placeholder-val=\"{{ false }}\">\n                        <div style=\"font-size: 13px; color: var(--ink-45); margin-top: -4px;\">{{ ib.hint }}<\u002Fdiv>\n                      <\u002Fsc-if>\n                      <textarea id=\"{{ ib.id }}\" value=\"{{ ib.value }}\" sc-camel-on-change=\"{{ ib.onChange }}\" rows=\"3\" placeholder=\"Write here…\" style=\"width: 100%; min-height: 92px; resize: vertical; background: var(--white); border: 1px solid var(--ink-15); border-radius: 4px; padding: 14px; font-size: 16px; line-height: 1.55; color: var(--ink);\"><\u002Ftextarea>\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n\n      <div data-noprint=\"true\" style=\"border-top: 1px solid var(--ink-15); margin-top: 48px; padding-top: 28px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center;\">\n        <button sc-camel-on-click=\"{{ prev }}\" style=\"appearance: none; cursor: pointer; font-family: var(--font-body); font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; padding: 15px 24px; border: 1px solid var(--ink-15); border-radius: 4px; background: transparent; color: var(--ink);\" style-hover=\"background: var(--sand);\">Back<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ complete }}\" style=\"appearance: none; cursor: pointer; font-family: var(--font-body); font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; padding: 15px 28px; border: 1px solid var(--ink); border-radius: 4px; background: var(--ink); color: var(--cream);\" style-hover=\"background: var(--action-primary-hover);\">{{ completeLabel }}<\u002Fbutton>\n        <span style=\"font-size: 13px; color: var(--ink-45);\">{{ savedNote }}<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fmain>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isPlan }}\" hint-placeholder-val=\"{{ false }}\">\n    <main style=\"max-width: 820px; margin: 0 auto; padding: clamp(40px, 6vw, 80px) 24px 40px;\">\n      <div style=\"font-family: var(--font-body); font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-45); margin-bottom: 18px;\">Section VII<\u002Fdiv>\n      <h1 style=\"font-family: var(--font-display); font-weight: 400; font-size: clamp(34px, 5vw, 56px); line-height: 1.14; letter-spacing: 0.02em; text-transform: uppercase; margin: 0 0 14px;\">Your Personal Battle Plan<\u002Fh1>\n      <p style=\"margin: 0 0 20px; color: var(--ink-70); max-width: 62ch;\">Everything you have written across the 30 days, gathered in one place. Edit any answer here — it saves as you type.<\u002Fp>\n      <div data-noprint=\"true\" style=\"display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 48px;\">\n        <button sc-camel-on-click=\"{{ printPlan }}\" style=\"appearance: none; cursor: pointer; font-family: var(--font-body); font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; padding: 14px 24px; border: 1px solid var(--ink); border-radius: 4px; background: var(--ink); color: var(--cream);\" style-hover=\"background: var(--action-primary-hover);\">Print / save as PDF<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ downloadPlan }}\" style=\"appearance: none; cursor: pointer; font-family: var(--font-body); font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; padding: 14px 24px; border: 1px solid var(--ink-15); border-radius: 4px; background: transparent; color: var(--ink);\" style-hover=\"background: var(--sand);\">Download as text<\u002Fbutton>\n      <\u002Fdiv>\n      <sc-for list=\"{{ planGroups }}\" as=\"g\" hint-placeholder-count=\"6\">\n        <section style=\"margin-bottom: 44px;\">\n          <div style=\"border-top: 1px solid var(--ink-15); padding-top: 18px; margin-bottom: 24px; display: flex; gap: 16px; align-items: baseline;\">\n            <span style=\"font-family: var(--font-body); font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-45); min-width: 88px;\">{{ g.eyebrow }}<\u002Fspan>\n            <span style=\"font-family: var(--font-display); font-size: 24px; line-height: 1.3; letter-spacing: 0.03em; text-transform: uppercase;\">{{ g.title }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display: grid; gap: 24px;\">\n            <sc-for list=\"{{ g.fields }}\" as=\"f\" hint-placeholder-count=\"3\">\n              <div style=\"display: grid; gap: 8px;\">\n                <label style=\"font-size: 15px; font-weight: 600;\" sc-camel-html-for=\"{{ f.planId }}\">{{ f.label }}<\u002Flabel>\n                <textarea id=\"{{ f.planId }}\" value=\"{{ f.value }}\" sc-camel-on-change=\"{{ f.onChange }}\" rows=\"3\" placeholder=\"Not written yet\" style=\"width: 100%; min-height: 84px; resize: vertical; background: var(--white); border: 1px solid var(--ink-15); border-radius: 4px; padding: 14px; font-size: 16px; line-height: 1.55; color: var(--ink);\"><\u002Ftextarea>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsection>\n      <\u002Fsc-for>\n    <\u002Fmain>\n  <\u002Fsc-if>\n\n  <footer data-noprint=\"true\" style=\"border-top: 1px solid var(--ink-15); margin-top: 40px;\">\n    <div style=\"max-width: 1240px; margin: 0 auto; padding: 44px 24px 64px; display: flex; flex-wrap: wrap; gap: 32px; justify-content: space-between; align-items: flex-start;\">\n      <div style=\"max-width: 46ch; display: grid; gap: 10px;\">\n        <div style=\"font-family: var(--font-body); font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-45);\">If you feel stuck or overwhelmed<\u002Fdiv>\n        <p style=\"margin: 0; color: var(--ink-70); font-size: 16px;\">You are not meant to walk this out alone. Reach out and our team will pray with you.<\u002Fp>\n        <a href=\"{{ prayerUrl }}\" target=\"_blank\" rel=\"noopener\" style=\"font-family: var(--font-body); font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; text-decoration: none; color: var(--ink); border-bottom: 1px solid var(--ink-15); padding-bottom: 4px; width: fit-content;\">Want prayer?<\u002Fa>\n      <\u002Fdiv>\n      <div style=\"display: grid; gap: 8px; font-size: 14px; color: var(--ink-45);\">\n        <span style=\"font-family: var(--font-display); font-size: 15px; letter-spacing: 0.14em; color: var(--ink);\">BLAMELESS<\u002Fspan>\n        <span>Preparing the Bride of Christ for Jesus’ return.<\u002Fspan>\n        <button sc-camel-on-click=\"{{ resetAll }}\" style=\"appearance: none; border: 0; background: none; padding: 0; text-align: left; cursor: pointer; font-size: 13px; color: var(--ink-45); text-decoration: underline;\">Clear everything saved in this browser<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Ffooter>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;requireSequence&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Experience&quot;},&quot;showDayMap&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Experience&quot;},&quot;prayerUrl&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;https://blmlss.com/prayer&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Experience&quot;}}\">\nconst KEY = 'blmlss-living-free-v1';\n\nclass Component extends DCLogic {\n  state = { units: null, answers: {}, done: {}, view: 'home', unitId: null, mapOpen: false, saved: '' };\n\n  componentDidMount() {\n    try {\n      const raw = localStorage.getItem(KEY);\n      if (raw) {\n        const d = JSON.parse(raw);\n        this.setState({ answers: d.answers || {}, done: d.done || {}, unitId: d.unitId || null });\n      }\n    } catch (e) {}\n    const load = () => {\n      const c = window.LIVING_FREE_CONTENT;\n      if (c) this.setState({ units: c.units });\n      else this._t = setTimeout(load, 30);\n    };\n    load();\n  }\n\n  persist(patch) {\n    const next = { answers: this.state.answers, done: this.state.done, unitId: this.state.unitId, ...patch };\n    try { localStorage.setItem(KEY, JSON.stringify({ answers: next.answers, done: next.done, unitId: next.unitId })); } catch (e) {}\n  }\n\n  write(id, val) {\n    const answers = { ...this.state.answers, [id]: val };\n    this.setState({ answers, saved: 'Saved' });\n    this.persist({ answers });\n  }\n\n  units() { return this.state.units || []; }\n\n  idx(id) { return this.units().findIndex(u => u.id === id); }\n\n  unlockedThrough() {\n    const us = this.units();\n    let i = 0;\n    while (i < us.length && this.state.done[us[i].id]) i++;\n    return i;\n  }\n\n  open(id) {\n    this.setState({ view: 'unit', unitId: id, mapOpen: false, saved: '' });\n    this.persist({ unitId: id });\n    if (typeof window !== 'undefined') window.scrollTo(0, 0);\n  }\n\n  completedDays() {\n    return this.units().reduce((n, u) => n + (this.state.done[u.id] ? (u.dayCount || 0) : 0), 0);\n  }\n\n  prep(list, depth) {\n    return (list || []).map(b => {\n      const o = { ...b, gap: '26px' };\n      if (b.t === 'p') { o.isP = true; o.html = { __html: b.x }; }\n      else if (b.t === 'h') { o.isH = true; o.gap = '18px'; }\n      else if (b.t === 'ul' || b.t === 'ol') {\n        o[b.t === 'ul' ? 'isUL' : 'isOL'] = true;\n        o.items = (b.items || []).map(x => ({ html: { __html: x } }));\n      }\n      else if (b.t === 's') { o.isS = true; o.gap = '30px'; }\n      else if (b.t === 'ex') { o.isEX = true; o.html = { __html: b.x }; }\n      else if (b.t === 'w') {\n        o.isW = true;\n        o.gap = '28px';\n        o.value = this.state.answers[b.id] || '';\n        o.onChange = e => this.write(b.id, e.target.value);\n        o.hint = b.hint || '';\n      }\n      else if (b.t === 'panel') {\n        o.isPanel = true;\n        o.gap = '36px';\n        o.blocks = this.prep(b.blocks, (depth || 0) + 1);\n        const tones = {\n          battleplan: ['var(--sand)', '0'],\n          journal: ['var(--white)', '1px solid var(--ink-15)'],\n          prayer: ['var(--blush)', '0'],\n          checkpoint: ['var(--mint)', '0'],\n          preview: ['var(--white)', '1px solid var(--ink-15)'],\n          focus: ['var(--peach)', '0']\n        };\n        const t = tones[b.kind] || tones.journal;\n        o.bg = t[0];\n        o.border = t[1];\n      }\n      return o;\n    });\n  }\n\n  planText() {\n    const lines = ['LIVING FREE — MY PERSONAL BATTLE PLAN', ''];\n    this.units().forEach(u => {\n      const fs = this.planFields(u);\n      if (!fs.length) return;\n      lines.push('— ' + (u.eyebrow ? u.eyebrow + ' · ' : '') + u.title, '');\n      fs.forEach(f => { lines.push(f.label, (this.state.answers[f.id] || '').trim() || '(not written yet)', ''); });\n    });\n    return lines.join('\\n');\n  }\n\n  planFields(u) {\n    const out = [];\n    const walk = list => (list || []).forEach(b => {\n      if (b.t === 'panel') walk(b.blocks);\n      else if (b.t === 'w' && b.plan) out.push(b);\n    });\n    walk(u.blocks);\n    return out;\n  }\n\n  renderVals() {\n    const us = this.units();\n    const unlocked = this.unlockedThrough();\n    const sequential = this.props.requireSequence !== false;\n    const days = this.completedDays();\n    const cur = us.find(u => u.id === this.state.unitId) || null;\n    const curIdx = cur ? this.idx(cur.id) : -1;\n\n    const dayDone = {};\n    us.forEach(u => { if (this.state.done[u.id] && (u.dayCount || 0) > 0) (u.days || []).forEach(d => { dayDone[d] = true; }); });\n    const currentDays = cur && (cur.dayCount || 0) > 0 ? (cur.days || []) : [];\n\n    const dayCells = Array.from({ length: 30 }, (_, i) => {\n      const n = i + 1;\n      const isDone = !!dayDone[n];\n      const isCur = currentDays.indexOf(n) !== -1;\n      return {\n        n,\n        title: 'Day ' + n,\n        bg: isDone ? 'var(--apricot)' : isCur ? 'var(--peach)' : 'transparent',\n        border: isCur ? 'var(--ink)' : isDone ? 'transparent' : 'var(--ink-15)',\n        fg: 'var(--ink)'\n      };\n    });\n\n    const mapRows = us.map((u, i) => {\n      const locked = sequential && i > unlocked;\n      return {\n        eyebrow: u.eyebrow || '',\n        title: u.title,\n        status: this.state.done[u.id] ? 'Complete' : locked ? 'Locked' : i === unlocked ? 'Next' : 'Open',\n        locked,\n        cursor: locked ? 'default' : 'pointer',\n        opacity: locked ? 0.4 : 1,\n        bg: cur && cur.id === u.id ? 'var(--white)' : 'transparent',\n        onClick: locked ? () => {} : () => this.open(u.id)\n      };\n    });\n\n    const sectionSummary = us.filter(u => u.kind === 'opener' || u.kind === 'final').map(u => ({\n      numeral: u.numeral || '',\n      title: u.title,\n      subtitle: u.subtitle || '',\n      days: u.kind === 'final' ? 'Ongoing' : (u.eyebrow || '')\n    }));\n\n    const planGroups = us.map(u => {\n      const fs = this.planFields(u).map(f => ({\n        planId: 'plan-' + f.id,\n        label: f.label,\n        value: this.state.answers[f.id] || '',\n        onChange: e => this.write(f.id, e.target.value)\n      }));\n      return { eyebrow: u.eyebrow || '', title: u.title, fields: fs };\n    }).filter(g => g.fields.length);\n\n    const nextUnit = curIdx >= 0 && curIdx + 1 < us.length ? us[curIdx + 1] : null;\n\n    return {\n      isHome: this.state.view === 'home',\n      isUnit: this.state.view === 'unit' && !!cur,\n      isPlan: this.state.view === 'plan',\n      mapOpen: this.state.mapOpen && us.length > 0,\n      progressLabel: days + ' of 30 days',\n      progressWidth: Math.round((days / 30) * 100) + '%',\n      prayerUrl: this.props.prayerUrl || 'https://blmlss.com/prayer',\n      ctaLabel: Object.keys(this.state.done).length ? 'Continue where I left off' : 'Begin day one',\n      dayCells: this.props.showDayMap === false ? [] : dayCells,\n      mapRows,\n      sectionSummary,\n      planGroups,\n      unitEyebrow: cur ? (cur.eyebrow || '') : '',\n      unitNumeral: cur ? (cur.numeral || '') : '',\n      unitTitle: cur ? cur.title : '',\n      unitSubtitle: cur ? (cur.subtitle || '') : '',\n      blocks: cur ? this.prep(cur.blocks, 0) : [],\n      completeLabel: cur && nextUnit ? (this.state.done[cur.id] ? 'Continue' : 'Mark complete & continue') : 'Finish',\n      savedNote: this.state.saved,\n      goHome: () => this.setState({ view: 'home', mapOpen: false }),\n      goPlan: () => { this.setState({ view: 'plan', mapOpen: false }); if (typeof window !== 'undefined') window.scrollTo(0, 0); },\n      toggleMap: () => this.setState({ mapOpen: !this.state.mapOpen }),\n      resume: () => {\n        const target = us.find(u => !this.state.done[u.id]) || us[us.length - 1];\n        if (target) this.open(target.id);\n      },\n      prev: () => {\n        if (curIdx > 0) this.open(us[curIdx - 1].id);\n        else this.setState({ view: 'home' });\n      },\n      complete: () => {\n        if (!cur) return;\n        const done = { ...this.state.done, [cur.id]: true };\n        this.setState({ done });\n        this.persist({ done });\n        if (nextUnit) this.open(nextUnit.id);\n        else { this.setState({ view: 'plan' }); if (typeof window !== 'undefined') window.scrollTo(0, 0); }\n      },\n      printPlan: () => { if (typeof window !== 'undefined') window.print(); },\n      downloadPlan: () => {\n        const blob = new Blob([this.planText()], { type: 'text/plain' });\n        const a = document.createElement('a');\n        a.href = URL.createObjectURL(blob);\n        a.download = 'my-battle-plan.txt';\n        a.click();\n        URL.revokeObjectURL(a.href);\n      },\n      resetAll: () => {\n        if (typeof window !== 'undefined' && !window.confirm('Clear everything you have written and start over?')) return;\n        try { localStorage.removeItem(KEY); } catch (e) {}\n        this.setState({ answers: {}, done: {}, view: 'home', unitId: null, mapOpen: false });\n      }\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
